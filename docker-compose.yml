services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - payflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-acquirer:
    build:
      context: .
      dockerfile: mock-acquirer/Dockerfile
    # Host port 8090, not 9090: 9090 is a common default (other Spring/monitoring
    # stacks grab it) and clashes on shared dev machines. Container port stays
    # 9090 - the gateway reaches it over the compose network, no host port needed.
    ports:
      - "${ACQUIRER_PORT:-8090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payflow
      DB_USER: payflow
      DB_PASSWORD: payflow
      ACQUIRER_BASE_URL: http://mock-acquirer:9090
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-acquirer:
        condition: service_healthy

  # Спостережуваність (стадія 7). Не потрібна для роботи шлюзу, тож за окремим
  # профілем: `docker compose --profile monitoring up`.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    environment:
      # Демо-стек: логін admin/admin, плюс анонімний перегляд без входу взагалі.
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      # Дозволяє серверний рендер дашборду в PNG через сервіс renderer нижче -
      # ним користується ops/grafana-screenshot.sh.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  renderer:
    image: grafana/grafana-image-renderer:3.11.5
    profiles: ["monitoring"]

volumes:
  payflow-postgres-data:
