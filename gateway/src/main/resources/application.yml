spring:
  application:
    name: payment-gateway

  threads:
    virtual:
      # Один віртуальний потік на кожен запит. Тут запити майже весь час просто
      # чекають - на Postgres, а пізніше і на еквайра - тож обмежений пул
      # платформних потоків був би довільною стелею, яку довелось би підбирати й
      # підкручувати навмання.
      #
      # Важливо, чого це НЕ прибирає: пул з'єднань нижче все одно обмежений, тож
      # під навантаженням черга просто переміщується з Tomcat у Hikari. Це свідомо -
      # саме база даних має бути дефіцитним ресурсом, який чинить опір першим.
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}
    hikari:
      # 30, а не значення "за замовчуванням" навмання - невеликий Postgres спокійно
      # тримає й сотні з'єднань, тож ліміт тут навмисно обраний під очікуване
      # навантаження, а не є випадковим числом. Саме цей ліміт, а не HTTP-шар,
      # має бути тим місцем, де система відчуває тиск під навантаженням - див.
      # коментар про virtual threads вище.
      maximum-pool-size: ${DB_POOL_SIZE:30}
      # Без minimum-idle: HikariCP тримає пул одразу прогрітим до
      # maximum-pool-size замість того, щоб нарощувати з'єднання реактивно під
      # навантаженням. Реактивне нарощування виявилось надто повільним під
      # раптовим сплеском у 200 одночасних запитів - пул встигав виростити лише
      # 9-12 з'єднань за 3 секунди, хоча ліміт дозволяв 30.
      connection-timeout: 3000
      # Краще швидко провалити запит, ніж дати йому зависнути в очікуванні з'єднання:
      # платіжний API, що відповідає "спробуй ще раз", кращий за той, що не відповідає взагалі.
      validation-timeout: 2000
      pool-name: gateway-pool

  jpa:
    # Схемою володіє Flyway. Hibernate дозволено лише перевіряти, що сутності досі
    # їй відповідають, і ніколи не змінювати її - тож помилка в мапінгу провалить
    # старт застосунку, а не мовчки змінить таблицю, в якій зберігаються гроші.
    hibernate:
      ddl-auto: validate
    # Ліниве завантаження поза межами транзакції - джерело випадкових N+1 запитів,
    # а також запитів, що виконуються вже під час запису HTTP-відповіді.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

payflow:
  acquirer:
    # localhost:8090 - типовий хост-порт mock-acquirer-а з docker-compose (9090
    # свідомо не займаємо, він конфліктний на спільних машинах). У самому Compose
    # gateway ходить до нього через мережу як http://mock-acquirer:9090.
    base-url: ${ACQUIRER_BASE_URL:http://localhost:8090}
    circuit-breaker:
      # Скільки транспортних невдач ПОСПІЛЬ (таймаут / розрив / 5xx) розмикають
      # ланцюг. Успішна відповідь у стані CLOSED скидає лічильник - разові збої
      # ланцюг не чіпають, лише стійка недоступність.
      failure-threshold: ${ACQUIRER_CB_FAILURE_THRESHOLD:5}
      # Скільки ланцюг лишається розімкненим, перш ніж пропустити одну пробну
      # спробу. Поки розімкнено, кожен платіж одразу йде в NEEDS_RECONCILIATION
      # без марного очікування таймауту.
      open-duration-ms: ${ACQUIRER_CB_OPEN_DURATION_MS:10000}
  reconciliation:
    poll-interval-ms: ${RECONCILIATION_POLL_INTERVAL_MS:1000}
    # Платіж у PROCESSING, не оновлений довше за цей час, вважається "залишеним"
    # (воркер чи інстанс помер посеред виклику) і підбирається sweeper-ом.
    # Помітно більший за найдовший реалістичний виклик до еквайра (таймаут
    # читання - 5с), щоб не чіпати платежі, які просто зараз обробляються.
    stale-processing-after-ms: ${RECONCILIATION_STALE_PROCESSING_AFTER_MS:60000}
    # "Оренда" на час активної спроби примирення - див. коментар до
    # reconcile_next_at у міграції V7.
    claim-lease-ms: ${RECONCILIATION_CLAIM_LEASE_MS:30000}
    base-backoff-ms: ${RECONCILIATION_BASE_BACKOFF_MS:1000}
    max-backoff-ms: ${RECONCILIATION_MAX_BACKOFF_MS:30000}
    # Після стількох безуспішних спроб дізнатись підсумок у еквайра платіж
    # чесно позначається FAILED з гучним логом, а не залишається висіти вічно.
    max-attempts: ${RECONCILIATION_MAX_ATTEMPTS:10}
    batch-size: ${RECONCILIATION_BATCH_SIZE:20}
    reconciler-count: ${RECONCILIATION_RECONCILER_COUNT:1}
  processing:
    # Обмежена черга в пам'яті - навмисно менша за maximum-pool-size, щоб
    # переповнення черги траплялось раніше, ніж вичерпання пулу з'єднань:
    # 503 "черга повна" - явна, керована відповідь, тоді як вичерпання пулу
    # зачіпає взагалі всі запити, включно з автентифікацією.
    queue-capacity: ${PROCESSING_QUEUE_CAPACITY:200}
    # Кожен воркер - окремий довгоживучий віртуальний потік, а не запис у
    # платформному пулі, тож це число обирається під бажану паралельність
    # звернень до еквайра, а не під кількість ядер CPU.
    worker-count: ${PROCESSING_WORKER_COUNT:8}
  webhooks:
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:5}
    base-backoff-ms: ${WEBHOOK_BASE_BACKOFF_MS:200}
    max-backoff-ms: ${WEBHOOK_MAX_BACKOFF_MS:5000}
    # "Оренда" на час активної доставки - див. коментар у міграції V6. Значно
    # більша за будь-який реалістичний час HTTP-виклику (тайм-аути клієнта
    # нижче - 2с/5с), щоб оренда ніколи не спливала передчасно під час
    # нормальної, просто повільної доставки.
    claim-lease-ms: ${WEBHOOK_CLAIM_LEASE_MS:30000}
    batch-size: ${WEBHOOK_BATCH_SIZE:20}
    poller-count: ${WEBHOOK_POLLER_COUNT:2}
    poll-interval-ms: ${WEBHOOK_POLL_INTERVAL_MS:200}

server:
  port: ${SERVER_PORT:8080}
  # Платежам, що вже в обробці, потрібно дати завершитись до завершення роботи JVM.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  simple:
    metrics:
      export:
        # Prometheus - єдиний реєстр (див. metrics/PrometheusEndpointConfig).
        # Без цього Boot додає ще й SimpleMeterRegistry як fallback, і кастомні
        # метрики з PaymentMetrics потрапляли б у нього, а не в scrape.
        enabled: false
  metrics:
    tags:
      # Спільний label для всіх серій цього інстансу - Prometheus теж додає свій
      # job/service, але application тег корисний, коли метрики летять деінде.
      application: ${spring.application.name}
    distribution:
      # Без цього http.server.requests не публікує _bucket-серій, і панелі
      # p50/p95/p99 у Grafana-дашборді були б порожні. Таймер payflow.acquirer.calls
      # вмикає гістограму сам, у коді (publishPercentileHistogram()).
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    com.payflow: INFO
  # Показуємо requestId (з RequestCorrelationFilter) і в текстовому виводі.
  pattern:
    level: "%5p [%X{requestId:-}]"
  # Порожньо - людиночитний вивід (локальна розробка). LOG_FORMAT=ecs у
  # docker-compose перемикає на однорядковий JSON (Elastic Common Schema), який
  # уміє парсити будь-який збирач логів. MDC-ключ requestId потрапляє в кожен
  # запис автоматично.
  structured:
    format:
      console: ${LOG_FORMAT:}
