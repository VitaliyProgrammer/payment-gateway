name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Testcontainers needs a real Docker daemon; ubuntu-latest runners ship one.
      # -Pbenchmark also builds/tests the load-generator module (its percentile
      # maths); the load run itself is not in CI.
      - name: Build and test
        run: ./mvnw -B -Pbenchmark verify
